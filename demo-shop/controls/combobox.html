<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Control: Combobox — Nimbus Goods</title><link rel="stylesheet" href="../styles.css"></head>
<body data-page="control-combobox">
  <nav class="nav"><a href="../index.html">Nimbus Goods</a> <a href="../catalog.html">Catalog</a></nav>
  <main>
    <h1>Control: combobox (clean)</h1>
    <label for="color">Color</label>
    <input id="color" role="combobox" aria-expanded="false" aria-controls="color-list" autocomplete="off">
    <ul id="color-list" role="listbox" hidden>
      <li role="option" aria-selected="false">Midnight</li>
      <li role="option" aria-selected="false">Moss</li>
      <li role="option" aria-selected="false">Clay</li>
    </ul>
    <p id="picked" role="status"></p>
  </main>
  <script>
    const inp=document.getElementById('color'),list=document.getElementById('color-list');
    inp.addEventListener('input',()=>{list.hidden=false;inp.setAttribute('aria-expanded','true')});
    inp.addEventListener('keydown',e=>{
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();
        const opts=[...list.querySelectorAll('[role=option]')];const i=opts.findIndex(o=>o.getAttribute('aria-selected')==='true');
        const n=Math.min(Math.max(i+(e.key==='ArrowDown'?1:-1),0),opts.length-1);
        opts.forEach(o=>o.setAttribute('aria-selected','false'));opts[n].setAttribute('aria-selected','true');
        inp.value=opts[n].textContent}
      if(e.key==='Escape'){list.hidden=true;inp.setAttribute('aria-expanded','false')}
    });
    inp.addEventListener('change',()=>document.getElementById('picked').textContent='Picked '+inp.value);
  </script>
</body>
</html>
