<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Control: Form — Nimbus Goods</title><link rel="stylesheet" href="../styles.css"></head>
<body data-page="control-form">
  <nav class="nav"><a href="../index.html">Nimbus Goods</a> <a href="../catalog.html">Catalog</a></nav>
  <main>
    <h1>Control: form (clean)</h1>
    <form onsubmit="return submitForm(event)">
      <label for="name">Full name</label><input id="name" required aria-describedby="name-err">
      <p id="name-err" class="error" role="alert" hidden>Please enter your name</p>
      <label for="email">Email</label><input id="email" type="email" required aria-describedby="email-err">
      <p id="email-err" class="error" role="alert" hidden>Please enter a valid email</p>
      <button type="submit">Sign up</button>
    </form>
    <p id="ok" role="status" hidden>Signed up. Check your inbox.</p>
  </main>
  <script>
    function submitForm(e){e.preventDefault();let ok=true;
      const name=document.getElementById('name'),email=document.getElementById('email');
      const set=(id,bad)=>{const el=document.getElementById(id);el.hidden=!bad;if(bad)ok=false};
      set('name-err',!name.value.trim());set('email-err',!email.value.includes('@'));
      if(ok){document.getElementById('ok').hidden=false}return false}
  </script>
</body>
</html>
